<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FESTIVAL 2026 - RETRO ARCADE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press+Start+2P', monospace;
            background-color: #05050a;
            color: #00ffcc;
        }
        .arcade-box {
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4), inset 0 0 15px rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
        }
        .btn-glow {
            transition: all 0.1s ease;
        }
        .btn-glow:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="arcade-box bg-slate-950 p-6 rounded-2xl max-w-md w-full text-center relative overflow-hidden">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-center text-xs text-slate-400 mb-6 border-b border-slate-800 pb-3">
            <span>🪙 FESTIVAL 2026</span>
            <span class="text-yellow-400">INSERT COIN ➔</span>
        </div>

        <!-- Score & Credit -->
        <div class="flex justify-between text-xs mb-6 text-cyan-400">
            <span>SCORE 000000</span>
            <span>CREDIT 01</span>
        </div>

        <!-- Main Title Badge -->
        <div class="inline-block border border-cyan-400/50 px-4 py-2 rounded-lg mb-6 text-sm bg-cyan-950/30">
            🎮 [ NEW QUEST ]
        </div>

        <!-- Glitch / Hidden Box -->
        <div id="quest-content" class="text-xl tracking-widest text-pink-500 font-bold mb-6 animate-pulse">
            ????
        </div>

        <p class="text-[10px] text-slate-300 mb-8 leading-relaxed">
            수락하면 다음 페이지에서 미션을 확인하실 수 있어요
        </p>

        <!-- Buttons Area -->
        <div class="flex gap-3 justify-center mb-6">
            <button id="accept-btn" class="btn-glow flex-1 bg-lime-400 hover:bg-lime-300 text-slate-950 font-bold py-3 px-4 rounded-lg text-xs shadow-lg shadow-lime-500/20">
                ✓ ACCEPT
            </button>
            <button id="decline-btn" class="btn-glow flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-lg text-xs shadow-lg shadow-purple-600/20">
                ✕ DECLINE
            </button>
        </div>

        <!-- Bottom Arcade Lights -->
        <div class="flex justify-center gap-2 mt-4 pt-4 border-t border-slate-900">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-lime-400"></span>
            <span class="text-[9px] text-slate-500 ml-auto self-center">1P START</span>
        </div>

    </div>

    <script>
        // 구글 시트 연동 URL (추후 입력)
        const GOOGLE_SCRIPT_URL = "";

        const acceptBtn = document.getElementById('accept-btn');
        const declineBtn = document.getElementById('decline-btn');
        const questContent = document.getElementById('quest-content');

        acceptBtn.addEventListener('click', () => {
            questContent.innerText = "MISSION ON!";
            questContent.classList.remove('text-pink-500');
            questContent.classList.add('text-lime-400');
            alert("퀘스트를 수락하셨습니다! 즐거운 페스티벌 되세요!");
            
            // TODO: 추후 구글 시트 데이터 전송 로직 추가 자리
        });

        declineBtn.addEventListener('click', () => {
            questContent.innerText = "CANCELED";
            questContent.classList.remove('text-pink-500');
            questContent.classList.add('text-red-500');
            alert("퀘스트를 거절하셨습니다.");
        });
    </script>
</body>
</html>
